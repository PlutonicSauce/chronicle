services:
  cockroach:
    image: cockroachdb/cockroach:v25.2.0
    command: start-single-node --insecure --listen-addr=0.0.0.0:26257 --http-addr=0.0.0.0:8080
    ports:
      - "26257:26257"
      - "8080:8080"
    volumes:
      - cockroach-data:/cockroach/cockroach-data
    healthcheck:
      test: ["CMD", "cockroach", "node", "status", "--insecure", "--host=localhost:26257"]
      interval: 5s
      timeout: 5s
      retries: 12

  migrate:
    image: cockroachdb/cockroach:v25.2.0
    depends_on:
      cockroach:
        condition: service_healthy
    volumes:
      - ./infra/schema.sql:/schema/schema.sql:ro
    command: sql --insecure --host=cockroach:26257 --file=/schema/schema.sql
    restart: "no"

  api:
    build: ./backend
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgresql://root@cockroach:26257/defaultdb?sslmode=disable
      CORS_ORIGINS: http://localhost:3000
    ports:
      - "8000:8000"

  web:
    build: ./frontend
    depends_on:
      - api
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    ports:
      - "3000:3000"

volumes:
  cockroach-data:
